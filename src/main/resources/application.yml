# ═══════════════════════════════════════════════════════════════════════════
# JURISFLOW - APPLICATION CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════

spring:
  application:
    name: jurisflow-api
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # ─────────────────────────────────────────────────────────────────────────
  # DOCKER COMPOSE SUPPORT (disabled - infrastructure runs separately)
  # ─────────────────────────────────────────────────────────────────────────
  docker:
    compose:
      enabled: false
  
  # ─────────────────────────────────────────────────────────────────────────
  # DATABASE
  # ─────────────────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jurisflow}
    username: ${DB_USER:jurisflow}
    password: ${DB_PASSWORD:secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
    open-in-view: false
  
  # ─────────────────────────────────────────────────────────────────────────
  # FLYWAY
  # ─────────────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  # ─────────────────────────────────────────────────────────────────────────
  # REDIS
  # ─────────────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  
  cache:
    type: redis
    redis:
      time-to-live: 3600000
  
  # ─────────────────────────────────────────────────────────────────────────
  # KAFKA
  # ─────────────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: jurisflow-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.jurisflow.event.model
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  
  # ─────────────────────────────────────────────────────────────────────────
  # MAIL
  # ─────────────────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  
  # ─────────────────────────────────────────────────────────────────────────
  # SERVLET
  # ─────────────────────────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# ═══════════════════════════════════════════════════════════════════════════
# SERVER
# ═══════════════════════════════════════════════════════════════════════════
server:
  port: ${PORT:8082}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# ═══════════════════════════════════════════════════════════════════════════
# SECURITY (JWT)
# ═══════════════════════════════════════════════════════════════════════════
jwt:
  secret: ${JWT_SECRET:pMqSvPAprDCc5JuoZq6CV7jTAveUQrY3YitMIq4r7q0=}
  expiration: 86400000
  refresh-expiration: 604800000

# ═══════════════════════════════════════════════════════════════════════════
# OPENAPI
# ═══════════════════════════════════════════════════════════════════════════
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json

# ═══════════════════════════════════════════════════════════════════════════
# ACTUATOR
# ═══════════════════════════════════════════════════════════════════════════
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ═══════════════════════════════════════════════════════════════════════════
# INTEGRATIONS
# ═══════════════════════════════════════════════════════════════════════════
integrations:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o
  
  stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  
  aws:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    region: ${AWS_REGION:sa-east-1}
    s3:
      bucket: ${S3_BUCKET:jurisflow-files}
  
  meilisearch:
    host: ${MEILISEARCH_HOST:http://localhost:7700}
    api-key: ${MEILISEARCH_API_KEY:}
  
  whatsapp:
    api-url: ${WHATSAPP_API_URL:}
    token: ${WHATSAPP_TOKEN:}

# ═══════════════════════════════════════════════════════════════════════════
# JURISFLOW AI — Motor Python (FastAPI RAG)
# ═══════════════════════════════════════════════════════════════════════════
jurisflow:
  ai:
    python:
      enabled: ${JURISFLOW_AI_PYTHON_ENABLED:true}
      url: ${JURISFLOW_AI_PYTHON_URL:http://localhost:8090}

# ═══════════════════════════════════════════════════════════════════════════
# LOGGING
# ═══════════════════════════════════════════════════════════════════════════
logging:
  level:
    root: INFO
    com.jurisflow: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

