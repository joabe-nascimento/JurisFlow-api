services:
  postgres:
    image: postgres:16-alpine
    container_name: jurisflow-postgres
    environment:
      POSTGRES_DB: jurisflow
      POSTGRES_USER: jurisflow
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - jurisflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jurisflow -d jurisflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jurisflow-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jurisflow_pg_data:
